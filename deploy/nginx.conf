# 超智学习空间生产反向代理（nginx 1.18+）
#
# 部署位置：/etc/nginx/conf.d/purplebook.conf
# 配套片段：/etc/nginx/conf.d/00-purplebook-limits.conf（limit_req_zone 必须在 http 上下文）
#
# 前提：
#   * learn.alphalio.cn 的 A/AAAA 记录指向本机（可换成你们的主域名）；
#   * uvicorn 只监听 127.0.0.1:8899，并带 --proxy-headers --forwarded-allow-ips=127.0.0.1；
#   * 防火墙只放行 80/443，8899/7860 不对公网开放。

upstream purplebook_app {
    server 127.0.0.1:8899;
    keepalive 32;
}

server {
    listen 80;
    server_name learn.alphalio.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name learn.alphalio.cn;

    ssl_certificate     /etc/letsencrypt/live/learn.alphalio.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.alphalio.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:PURPLEBOOK_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # 现代浏览器以应用下发的 CSP frame-ancestors 为准（允许 ModelScope Studio）；
    # 这里给旧浏览器一个同源兜底，不能写 DENY，否则 Studio 内嵌会被拦。
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 站点没有上传入口；留一个小的上限，避免代理层成为上传放大器。
    client_max_body_size 8m;

    # 登录、许愿、讨论、练习提交都是写接口，给一个宽但存在的边缘限流。
    # 应用内部还有按用户/分钟的计数，这里只挡明显异常的单 IP 洪水。
    # 只对 /api/ 与 /auth/ 生效，静态资源不参与限流。
    location /api/ {
        limit_req zone=purplebook_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://purplebook_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /auth/ {
        limit_req zone=purplebook_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://purplebook_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://purplebook_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 静态资源由应用带版本号与长期缓存；代理层不额外改写 Cache-Control。
    location /assets/ {
        proxy_pass http://purplebook_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
