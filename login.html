<!doctype html>
<html lang="zh-CN" data-i18n-title="login.pageTitle" data-i18n-description="login.description">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7c13b">
  <meta name="description" content="登录超智学习空间，参与讨论、保存划线与同步练习进度。">
  <link rel="icon" href="/assets/brand/book-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=1387f6bba4f1">
  <link rel="stylesheet" href="/assets/i18n.css?v=fb1a351970a2">
  <link rel="stylesheet" href="/assets/login.css?v=574f3dc1f31b">
  <title>登录｜超智学习空间</title>
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="login-top">
      <a class="login-wordmark" href="/" aria-label="超智学习空间首页" data-i18n-attr="aria-label:login.home">
        <img src="/assets/brand/book-mark.svg" alt="" width="34" height="34">
        <span>SILS</span>
      </a>
      <span class="language-switcher" data-language-switcher></span>
    </div>
    <section class="login-card" aria-labelledby="loginTitle">
      <p class="login-eyebrow">SUPER INTELLIGENCE LEARNING SPACE</p>
      <h1 id="loginTitle" data-i18n="login.title">登录学习空间</h1>
      <p class="login-intro" data-i18n="login.intro">登录后可以发表评论、保存划线与同步练习进度。</p>
      <form id="loginForm" novalidate method="post" action="/auth/login">
        <label for="loginEmail" data-i18n="login.email">邮箱</label>
        <input id="loginEmail" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" required placeholder="you@example.com">
        <label for="loginPassword" data-i18n="login.password">密码</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" maxlength="200" required>
        <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
        <button id="loginSubmit" class="login-submit" type="submit" data-i18n="login.submit">登录</button>
      </form>
      <p class="login-oauth" id="oauthLogin" hidden><a href="/auth/oauth/login" data-i18n="login.oauth">使用 ModelScope 社区账号登录</a></p>
      <p class="login-note" data-i18n="login.note">已有账号可直接登录；新用户可在下方自助注册。</p>
      <section class="register-section" aria-labelledby="registerTitle">
        <h2 id="registerTitle" data-i18n="login.registerTitle">没有账号？自助注册</h2>
        <p class="register-intro" data-i18n="login.registerIntro">注册后即可评论、划线并同步练习进度。</p>
        <form id="registerForm" novalidate method="post" action="/api/auth/register">
          <label for="registerName" data-i18n="login.registerName">昵称（选填）</label>
          <input id="registerName" name="display_name" type="text" autocomplete="nickname" maxlength="100">
          <label for="registerEmail" data-i18n="login.registerEmail">注册邮箱</label>
          <input id="registerEmail" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" required placeholder="you@example.com">
          <label for="registerPassword" data-i18n="login.registerPassword">密码（至少 8 位，含字母和数字）</label>
          <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="200" required>
          <label for="registerConfirm" data-i18n="login.registerConfirm">确认密码</label>
          <input id="registerConfirm" name="confirm" type="password" autocomplete="new-password" maxlength="200" required>
          <p id="registerStatus" class="login-status" role="status" aria-live="polite"></p>
          <button id="registerSubmit" class="login-submit" type="submit" data-i18n="login.registerSubmit">注册并登录</button>
        </form>
        <p class="login-note" data-i18n="login.registerNote">密码使用 scrypt 存储；注册仅用于本站学习，不会向第三方出售。</p>
      </section>
    </section>
    <a class="login-back" href="/" data-i18n="login.back">← 返回阅读空间</a>
  </main>
  <script src="/assets/i18n.js?v=08e26ea1aec9"></script>
  <script src="/assets/locale/zh.js?v=79be04c03dc2"></script>
  <script src="/assets/locale/en.js?v=c62e534a5579"></script>
  <script src="/assets/locale/es.js?v=afea83f1127d"></script>
  <script src="/assets/language-switcher.js?v=d4550b90d72b"></script>
  <script src="/assets/login.js?v=39f31a9add1b"></script>
</body>
</html>
