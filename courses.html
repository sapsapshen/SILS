<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#faf7f1">
<title>延伸课程 · 超智学习空间</title>
<meta name="description" content="超智学习空间的 GitHub 开源延伸课程目录：仓库链接、许可署名与章节映射。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#171412;--ink-2:#4a423d;--line:rgba(23,20,18,.12);--brand:#8a580c;--bg:#faf7f1;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
a{color:var(--brand)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
/* 头部与 /cases、/teams 同一套：图标 38px + SILS */
.top{border-bottom:1px solid var(--line);background:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
@font-face{font-family:"Purple Book Serif";src:url("/assets/brand/wordmark-serif.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
/* LOGO 与首页 .wordmark 完全一致：定制衬线体、24px/700、字距 .075em、图标 38px */
.brand{display:flex;align-items:center;gap:11px;font-family:"Purple Book Serif","Songti SC",STSong,serif;font-size:24px;font-weight:700;line-height:1.3;letter-spacing:1.8px;text-decoration:none;color:#221e16}
.brand img{width:38px;height:38px}
.top-right{display:flex;align-items:center;gap:20px;min-width:0}
.top nav{display:flex;gap:18px;align-items:center;font-size:14px}
.top nav a{color:var(--ink-2);text-decoration:none;white-space:nowrap}
.top nav a:hover{color:var(--ink)}
#langSwitch{display:inline-flex;gap:6px}
#langSwitch button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:4px 12px}
#langSwitch button.is-active{background:var(--ink);border-color:var(--ink);color:#fff}
.hero{padding-block:48px 20px}
.kicker{display:inline-block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:700;margin-bottom:14px}
h1{font-size:clamp(28px,4.2vw,42px);line-height:1.2;margin:0 0 16px;letter-spacing:-.02em}
.lead{font-size:17px;color:var(--ink-2);max-width:64ch;margin:0 0 8px}
.policy{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.75;color:var(--ink-2);margin:0}
#filters{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 20px}
#filters button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:6px 14px}
#filters button.is-active{background:var(--ink);border-color:var(--ink);color:#fff}
.shared-note{font-size:13px;line-height:1.7;color:var(--ink-2);margin:0 0 4px}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding-bottom:56px}
.course-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px}
.course-top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.course-repo{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all;color:var(--ink-2)}
.course-license{border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:#fbf9f5;white-space:nowrap}
.course-card h2{margin:0;font-size:20px;letter-spacing:-.01em}
.course-summary{margin:0;color:var(--ink-2);line-height:1.75;font-size:14px;flex:1}
.course-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0;font-size:13px}
.course-meta dt{color:var(--ink-2);font-size:11px;letter-spacing:.04em;margin-bottom:2px}
.course-meta dd{margin:0;word-break:break-word}
.course-chapters{margin:0;font-size:13px;color:var(--ink-2)}
.course-chapters a{display:inline-block;margin-right:5px;padding:1px 8px;border-radius:999px;background:rgba(138,88,12,.08);color:var(--brand);text-decoration:none;font-variant-numeric:tabular-nums}
.course-open{align-self:flex-start;background:var(--brand);color:#fff;text-decoration:none;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600}
.course-open:hover{background:#71480a}
.empty{color:var(--ink-2)}
footer{border-top:1px solid var(--line);padding:26px 0;margin-top:40px;font-size:13px;color:var(--ink-2)}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}
@media(max-width:760px){
  .top .wrap{height:auto;padding:12px 20px;flex-wrap:wrap}
  .top-right{width:100%;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .hero{padding-block:32px 14px}
  .course-grid{grid-template-columns:1fr}
}
@media(max-width:700px){.brand{gap:8px;font-size:21px;letter-spacing:1.05px}.brand img{width:32px;height:32px}}
/* 当前位置：与主站一致的下划线索引 */
.top nav [aria-current="page"]{color:var(--ink);font-weight:600;position:relative;padding-bottom:2px}
.top nav [aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:var(--ink)}

/* 与 cases/teams 同一套移动端断点：导航项单行、不越界、不隐藏任何项、不横滑。
   本页 360/320 折行是既有缺陷（导航 4 项含「› 超智学习空间」合计 338px > 可用宽度），
   此前那两条 media query 并未覆盖 nav。 */
@media(max-width:700px){
  .top .wrap{padding:10px 16px 0}
  .top-right{width:100%;flex-wrap:wrap;justify-content:flex-start;gap:8px}
  .top nav{width:100%;flex:1 0 100%;min-width:0;gap:8px;font-size:12px}
  .top nav > *{flex:0 0 auto;white-space:nowrap;padding-block:4px}
  .top nav > [aria-current="page"]{padding-bottom:4px}
  .top nav [aria-current="page"]::after{bottom:2px}
}
@media(max-width:360px){
  .top .wrap{padding:10px 12px 0}
  .top-right{gap:6px}
  .top nav{gap:2px;font-size:11px}
}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0;font-size:14px}
.hero-actions a{display:inline-flex;align-items:center;min-height:40px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink-2);background:#fff}
.hero-actions a:hover{color:var(--ink);border-color:rgba(23,20,18,.3)}
</style>
